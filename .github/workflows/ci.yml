name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "PAC-25" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Build and Test the Java Application
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Matches our Dockerfile
          cache: maven

      - name: Run Unit Tests with Maven
        run: mvn clean test

      - name: Build JAR package
        run: mvn package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colis-system-jar
          path: target/*.jar

  # JOB 2: Verify Docker Image Build
  docker-build:
    needs: build-and-test # Only run if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: colis-system:latest